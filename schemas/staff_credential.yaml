name: staff_credential
description: A staff member's professional credential record (e.g. for clinic or agency credentialing).
fields:
  - {name: full_name, type: string, required: true, description: "Staff member's full name."}
  - {name: date_of_birth, type: date, description: "Date of birth, as YYYY-MM-DD."}
  - {name: profession, type: string, required: true, description: "Profession or role, e.g. Registered Nurse."}
  - {name: licence_number, type: string, required: true, description: "Professional licence or registration number."}
  - {name: issuing_body, type: string, required: true, description: "Organisation that issued the licence."}
  - {name: licence_expiry, type: date, required: true, description: "Licence expiry date, as YYYY-MM-DD."}
  - {name: specialty, type: string, description: "Clinical or professional specialty."}
  - {name: employer, type: string, description: "Current employer or agency."}
  - {name: background_check_cleared, type: boolean, description: "True if a background/criminal record check is recorded as cleared."}
