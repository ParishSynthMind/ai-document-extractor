[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-document-extractor"
version = "0.1.0"
description = "Extract structured, confidence-checked fields from PDF (text or scanned), Word and Excel files with Claude."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "anthropic>=2.0",
  "pdfplumber>=0.11",
  "pypdf>=5.0",
  "pytesseract>=0.3.10",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.scripts]
extract = "doc_extractor.cli:main"
qbo-push = "doc_extractor.quickbooks.cli:main"
xero-push = "doc_extractor.xero.cli:main"

[tool.setuptools]
packages = ["doc_extractor", "doc_extractor.quickbooks", "doc_extractor.xero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731"]  # long prompt strings and one small lambda are fine
